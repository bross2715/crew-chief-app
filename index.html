<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Crew Chief HQ</title><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#070a0f"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Crew Chief"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png"><meta property="og:title" content="Crew Chief HQ"><meta property="og:description" content="NASCAR 26 setups, laps and coaching for Southpaw"><meta property="og:image" content="https://bross2715.github.io/crew-chief-app/icon-512.png"><meta property="og:url" content="https://bross2715.github.io/crew-chief-app/"><meta name="twitter:card" content="summary">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,500;0,600;0,700;1,800&display=swap" rel="stylesheet">
<style>
:root{--bg:#070a0f;--c1:#0d1219;--c2:#131a24;--line:rgba(130,185,255,.13);--grid:rgba(95,208,255,.07);--txt:#f2f4f7;--mut:#8591a3;--green:#2fe07f;--gold:#ffd23f;--red:#ff4d5a;--brand:#e8334a;--blue:#5aa7ff;--cy:#5fd0ff;--hd:"Barlow Condensed","Arial Narrow",Impact,sans-serif;--bd:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box;margin:0}
body{background:radial-gradient(900px 420px at 10% -10%,rgba(232,51,74,.14),transparent 60%),radial-gradient(800px 420px at 100% 0,rgba(95,208,255,.08),transparent 60%),var(--bg);background-attachment:fixed;color:var(--txt);font-family:var(--bd);font-size:14px;min-height:100vh;min-height:100dvh}
html{background:#070a0f}
.wrap{max-width:1180px;margin:0 auto;padding:env(safe-area-inset-top,0px) calc(12px + env(safe-area-inset-left,0px)) calc(48px + env(safe-area-inset-bottom,0px)) calc(12px + env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 10px}
.brand{font-family:var(--hd);font-style:italic;font-weight:800;font-size:30px;text-transform:uppercase;line-height:1;letter-spacing:.5px}.brand b{color:var(--brand)}
.sub{color:var(--mut);font-size:11.5px;margin-top:3px}
.drv{display:flex;align-items:center;gap:9px;background:var(--c1);border:1px solid var(--line);border-radius:14px;padding:5px 14px 5px 5px;flex:none}
.drv img.av{width:46px;height:46px;border-radius:10px;object-fit:cover;display:block}
.drv i{width:32px;height:32px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#6d1424);display:grid;place-items:center;font:700 14px var(--hd);font-style:normal}
.drv b{display:block;font:700 15px var(--hd);letter-spacing:.5px;line-height:1}.drv small{color:var(--mut);font-size:10.5px}
nav{position:sticky;top:0;z-index:6;display:flex;gap:8px;overflow-x:auto;padding:8px 0 10px;background:linear-gradient(180deg,var(--bg) 70%,transparent);scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;background:var(--c1);border:1px solid var(--line);color:var(--mut);font:700 14px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:9px 16px;border-radius:999px;cursor:pointer}
nav button.on{color:#fff;background:linear-gradient(180deg,#d02a47,var(--brand));border-color:transparent}
nav button i{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-left:7px;box-shadow:0 0 8px var(--green)}
.bento{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.card{grid-column:span 12;background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.008)),var(--c1);border:1px solid var(--line);border-radius:8px;padding:14px;position:relative;overflow:hidden;min-width:0}
@media(min-width:820px){.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}}
.lbl{display:flex;align-items:center;gap:7px;color:var(--mut);font:600 11.5px var(--bd);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:10px}
.lbl:before{content:"";width:6px;height:6px;border-radius:2px;background:var(--brand)}
.lbl em{margin-left:auto;font-style:normal;letter-spacing:.3px;text-transform:none;color:var(--mut);font-size:11px}
.g{color:var(--green)}.r{color:var(--red)}.y{color:var(--gold)}.b{color:var(--blue)}
.big{font:700 44px/1 var(--hd);letter-spacing:.5px}.mid{font:700 28px/1 var(--hd)}
.mut{color:var(--mut)}.sm{font-size:12px}
/* fastest lap strip */
.strip{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;background:linear-gradient(90deg,rgba(139,92,246,.35),rgba(196,36,63,.25));border:1px solid rgba(139,92,246,.45);padding:12px 16px}
.strip .t{font:700 15px var(--hd);letter-spacing:1.5px;text-transform:uppercase}
.strip .k{display:flex;flex-direction:column}.strip .k small{color:#c9c2e8;font-size:10.5px;letter-spacing:1px;text-transform:uppercase}.strip .k b{font:700 24px/1.05 var(--hd)}
/* hero */
.hero h2{font:800 italic 34px/1 var(--hd);text-transform:uppercase}.hero h2 b{color:var(--gold)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font:600 11px var(--bd);letter-spacing:.8px;text-transform:uppercase;border:1px solid var(--line);background:rgba(255,255,255,.04);border-radius:999px;padding:4px 10px;color:#cfd5de}
.chip.on{color:var(--green);border-color:rgba(46,226,122,.4);background:rgba(46,226,122,.08)}
.map{height:auto;aspect-ratio:100/52;max-height:260px;display:block;width:100%;margin:6px 0 2px}
.trace{stroke-dasharray:1;stroke-dashoffset:1}.trace.go{animation:trk 3s linear forwards}@keyframes trk{to{stroke-dashoffset:0}}
/* gauges */
.gc{display:grid;place-items:center;text-align:center}
.gc svg{width:100%;max-width:210px}
.gc .vv{margin-top:-34px}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rg{text-align:center}.rg svg{width:100%;max-width:92px}
.rg b{display:block;font:700 12px var(--bd);letter-spacing:1px;color:var(--mut);margin-top:2px}
.wedge{display:flex;align-items:center;justify-content:space-between;margin-top:12px;background:var(--c2);border-radius:12px;padding:9px 12px}
.wedge b{font:700 22px var(--hd)}
/* car */
.car{display:grid;grid-template-columns:1fr 84px 1fr;gap:8px;align-items:center}
.cs{display:flex;flex-direction:column;gap:10px}
.tire{background:var(--c2);border:1px solid var(--line);border-radius:14px;padding:8px 4px;text-align:center}
.tire svg{width:62px;height:62px}
.tire small{display:block;color:var(--mut);font-size:10px;letter-spacing:1px;margin-top:2px}
.tire .tp{font:600 11px var(--bd);color:#cfd5de;margin-top:2px;letter-spacing:.2px}
.car svg.body{width:100%}
.bars{display:grid;gap:9px;margin-top:12px}
.bar{display:grid;grid-template-columns:70px 1fr 40px;align-items:center;gap:8px;font-size:12px}
.bar span{color:var(--mut);text-transform:uppercase;letter-spacing:1px;font-size:10.5px}
.bar div{height:7px;border-radius:9px;background:rgba(255,255,255,.08);overflow:hidden}.bar div i{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--green),var(--gold))}
.bar b{font:700 15px var(--hd);text-align:right}
.tabs{display:flex;gap:6px;margin-bottom:10px;overflow-x:auto}
.tabs button{flex:none;background:var(--c2);border:1px solid var(--line);color:var(--mut);font:700 12px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:6px 11px;border-radius:999px;cursor:pointer}
.tabs button.on{color:#fff;border-color:var(--brand)}
/* tables */
table{width:100%;border-collapse:collapse}
th{color:var(--mut);font:600 10.5px var(--bd);letter-spacing:1.2px;text-transform:uppercase;text-align:left;padding:8px 8px;background:rgba(255,255,255,.035)}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:9px 8px;border-bottom:1px solid var(--line);font-size:13px}
td.n{font:700 17px var(--hd)}
tr.go{cursor:pointer}tr.cur td{background:rgba(196,36,63,.12)}
.up{color:var(--green)}.dn{color:var(--red)}
/* feed */
.ev{display:flex;gap:10px;background:var(--c2);border-radius:12px;padding:10px 12px;margin-bottom:8px;border-left:3px solid var(--gold);font-size:12.5px;line-height:1.4;color:#dfe3ea}
.ev b{display:block;font:700 11px var(--bd);letter-spacing:1.2px;text-transform:uppercase;margin-bottom:2px;color:var(--gold)}
.ev.gap{border-left-color:var(--blue)}.ev.gap b{color:var(--blue)}
.ev.ok{border-left-color:var(--green)}.ev.ok b{color:var(--green)}
.ev.bad{border-left-color:var(--red)}.ev.bad b{color:var(--red)}
/* setups */
.sets{display:grid;gap:10px}
@media(min-width:820px){.sets{grid-template-columns:1fr 1fr}}
.su{background:var(--c2);border:1px solid var(--line);border-radius:14px;padding:11px;border-left:3px solid #4a5260}
.su.pref{border-left-color:var(--gold)}.su.ok{border-left-color:var(--green)}.su.bad{border-left-color:var(--red)}
.su .h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}.su .h b{font:700 20px var(--hd)}.su .h small{color:var(--mut);font-size:11px;text-align:right}
.psi{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin:8px 0;text-align:center}
.psi div{background:rgba(255,255,255,.05);border-radius:8px;padding:5px 0}.psi small{display:block;color:var(--mut);font-size:9.5px;letter-spacing:.8px}.psi b{font:700 17px var(--hd)}
.su p{color:#b7bec9;font-size:12px;line-height:1.4}
.send{margin-top:9px;background:linear-gradient(180deg,#d02a47,var(--brand));color:#fff;border:0;border-radius:9px;font:700 13px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:8px 14px;cursor:pointer}
details{margin-top:2px}summary{cursor:pointer;color:var(--mut);font:600 11.5px var(--bd);letter-spacing:1.2px;text-transform:uppercase;list-style:none;padding:2px 0}
summary::-webkit-details-marker{display:none}summary:after{content:"  +";color:var(--brand)}details[open] summary:after{content:"  -"}
.lap{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:12.5px}
.lap b{font:700 18px var(--hd);flex:none;min-width:70px}.lap span{color:#b7bec9;flex:1}.lap small{color:var(--mut);flex:none;font-size:11px}
.lap.pb b{color:var(--gold)}
[hidden]{display:none!important}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.mini div{background:var(--c2);border-radius:12px;padding:10px 6px;text-align:center}.mini small{display:block;color:var(--mut);font-size:10.5px;letter-spacing:1px;text-transform:uppercase}.mini b{font:700 28px/1.1 var(--hd)}
.hl{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}.hl i{font:700 14px var(--hd);color:var(--mut);width:18px;font-style:normal}.hl b{font:700 24px var(--hd);min-width:84px}.hl span{flex:1;color:#b7bec9;font-size:12px}.hl em{font-style:normal;font-size:11px;color:var(--mut)}.hl.top b{color:var(--gold)}
.kv{display:flex;gap:8px;font-size:12.5px;margin-top:6px;color:#c9cfd9;line-height:1.35}.kv b{color:var(--mut);font:600 10.5px var(--bd);letter-spacing:1px;text-transform:uppercase;flex:none;min-width:86px;padding-top:2px}
.tr4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.tr4 .tire svg{width:100%;max-width:62px;height:auto}.tr4 .tp{font-size:9.5px}
.cmp td,.cmp th{padding:8px 5px;font-size:12px;letter-spacing:0}.cmp td.n{font-size:15px}.more>summary{background:var(--c1);border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;color:#cfd5de}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:var(--c1);border:1px solid var(--line);border-top:2px solid var(--brand);border-radius:18px 18px 0 0;padding:12px 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:9}
#sheet textarea{width:100%;height:150px;background:var(--c2);color:var(--txt);border:1px solid var(--line);border-radius:10px;padding:8px;font:14px var(--bd);resize:none}
#sheet .bt{display:flex;gap:8px;margin-top:8px}#sheet .bt button{flex:1;background:var(--c2);color:var(--txt);border:1px solid var(--line);border-radius:9px;font:700 15px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:10px}
#sheet .bt button.go{background:var(--brand);border-color:var(--brand)}

/* ===== app shell ===== */
.app-top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 2px 6px}
.logo{font:800 italic 30px/1 var(--hd);text-transform:uppercase;letter-spacing:.5px}.logo b{color:var(--brand)}
.logo small{display:block;font:500 12px var(--bd);font-style:normal;text-transform:none;letter-spacing:0;color:var(--mut);margin-top:4px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:7;display:flex;align-items:center;gap:8px;padding:10px 0 10px;background:linear-gradient(180deg,var(--bg) 78%,transparent)}
.bar .sp{flex:1}
.bar button{background:var(--c1);border:1px solid var(--line);color:#dbe3ee;font:700 14px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:8px 14px;border-radius:6px;cursor:pointer}
.bar button.sq{padding:8px 13px;font-size:18px;line-height:1}
.bar button:focus-visible,.tile:focus-visible,.go:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.hero2{position:relative;border:1px solid var(--line);border-radius:8px;background:linear-gradient(180deg,#0c1219,#080b10);overflow:hidden;margin:0 0 12px;padding:16px 14px 16px}
.hero2:before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:26px 26px;-webkit-mask-image:radial-gradient(75% 85% at 62% 42%,#000,transparent);mask-image:radial-gradient(75% 85% at 62% 42%,#000,transparent);pointer-events:none}
.hero2>*{position:relative}
.hero2 .hmap{margin:2px -4px 8px}
.hero2 .hmap svg{display:block;width:100%;max-height:300px;height:auto;filter:drop-shadow(0 0 14px rgba(95,208,255,.3))}
.hero2 h1{font:800 italic clamp(44px,13vw,84px)/.88 var(--hd);text-transform:uppercase;letter-spacing:.5px}
.hero2 .rn{font:700 15px var(--hd);letter-spacing:1.6px;color:var(--cy);text-transform:uppercase;margin-bottom:6px}
.hero2 .res{display:flex;flex-wrap:wrap;gap:6px 22px;margin-top:14px}
.hero2 .res div{display:flex;flex-direction:column}.hero2 .res small{color:var(--mut);font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase}.hero2 .res b{font:700 30px/1.05 var(--hd)}
.hero2 .go{margin-top:14px;display:inline-block;background:linear-gradient(180deg,#f0384f,var(--brand));color:#fff;border:0;border-radius:6px;font:700 15px var(--hd);letter-spacing:1px;text-transform:uppercase;padding:11px 20px;cursor:pointer}
.hero2 p{color:#c3ccd8;font-size:13.5px;line-height:1.45;margin-top:10px;max-width:60ch}
@media(min-width:820px){.hero2{display:grid;grid-template-columns:1.25fr 1fr;gap:18px;align-items:center}.hero2 .hmap{margin:0}.hero2 .bar-like{display:none}}
.mfill{fill:#f2f3ef}.mline{fill:none;stroke:var(--cy);stroke-width:1.3;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;opacity:0}
.hmap.play .mline{opacity:1;animation:draw 1.5s ease-out forwards,hide .5s 1.6s forwards}
.hmap.play .mfill{fill-opacity:0;animation:fillin .7s 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}@keyframes hide{to{opacity:0}}@keyframes fillin{to{fill-opacity:1}}
@media(prefers-reduced-motion:reduce){.hmap.play .mline{animation:none;opacity:0}.hmap.play .mfill{animation:none;fill-opacity:1}}
.chips .k{border-color:rgba(255,210,63,.4);color:var(--gold);background:rgba(255,210,63,.08)}
.sec{display:flex;align-items:baseline;gap:10px;margin:24px 2px 10px}.sec b{font:800 italic 26px/1 var(--hd);text-transform:uppercase}.sec span{color:var(--mut);font-size:12.5px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:640px){.tiles{grid-template-columns:repeat(3,1fr)}}@media(min-width:980px){.tiles{grid-template-columns:repeat(4,1fr)}}
.tile{position:relative;display:block;width:100%;text-align:left;color:var(--txt);font-family:var(--bd);background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.008)),var(--c1);border:1px solid var(--line);border-radius:6px;padding:10px 10px 11px;cursor:pointer}
.tile:before,.tile:after{content:"";position:absolute;width:9px;height:9px;border:1.5px solid var(--cy);opacity:.5;pointer-events:none}
.tile:before{top:-1px;left:-1px;border-right:0;border-bottom:0}.tile:after{right:-1px;bottom:-1px;border-left:0;border-top:0}
.tile .no{font:700 13px var(--hd);letter-spacing:1px;color:var(--mut)}
.tile .tm{height:70px;margin:2px 0 6px;display:grid;place-items:center;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:14px 14px}
.tile .tm svg{width:100%;height:100%}.tile .mfill{fill-opacity:.9;transition:filter .15s}
.tile:hover .tm svg{filter:drop-shadow(0 0 7px rgba(95,208,255,.55))}
.tile .tn{font:800 italic 21px/1 var(--hd);text-transform:uppercase}
.tile .tr{font:600 12px var(--bd);color:var(--mut);margin-top:4px}
.tile .dot{position:absolute;top:9px;right:9px;width:8px;height:8px;border-radius:50%}
.tile.raced .dot{background:var(--green);box-shadow:0 0 8px var(--green)}
.tile.nodrive .dot{border:1.5px solid var(--mut)}
.tile.next{border-color:rgba(255,210,63,.55)}.tile.next .dot{background:var(--gold);box-shadow:0 0 8px var(--gold)}
.tile.off{border-style:dashed;opacity:.82}
.tile .mfill{fill:#f2f3ef}.tile.off .mfill{fill-opacity:.55}
.nomap{height:70px;display:grid;place-items:center;color:var(--mut);font:600 11.5px var(--bd);text-align:center;border:1px dashed var(--line);border-radius:4px;margin:2px 0 6px}
.plan{display:grid;gap:8px;margin-top:4px}.plan div{background:var(--c2);border-radius:6px;padding:10px 12px;font-size:13.5px;line-height:1.4;color:#dfe5ee;border-left:3px solid var(--cy)}
.plan b{display:block;font:700 12px var(--bd);letter-spacing:1.1px;text-transform:uppercase;color:var(--cy);margin-bottom:2px}
.tile .mfill,.hmap .mfill{stroke:none}

/* track report */
.rep{padding:12px 12px 14px}
.rep .hd2{font:600 12.5px var(--bd);color:#cfd5de;margin:-2px 0 6px}
.rep svg{width:100%;height:auto;display:block;touch-action:manipulation}
.rep .cs{fill:none;stroke:#1a212c;stroke-width:calc(var(--k)*20);stroke-linecap:round;stroke-linejoin:round}
.rep .sg{fill:none;stroke-width:calc(var(--k)*12.5);stroke-linecap:butt;stroke-linejoin:round}
.rep .sg.red{stroke:var(--red)}.rep .sg.amber{stroke:var(--gold)}.rep .sg.green{stroke:var(--green)}
.rep .ld{stroke:rgba(255,255,255,.3);stroke-width:calc(var(--k)*1.2)}
.rep .dt{fill:#fff}.rep .dt.on{fill:var(--cy);animation:pl 1.4s ease-in-out infinite}
@keyframes pl{50%{opacity:.3}}
.rep .tc{fill:#0a0e14;stroke:rgba(255,255,255,.6);stroke-width:calc(var(--k)*1.7)}
.rep .tx{fill:#fff;font-family:var(--bd);font-weight:700;font-size:calc(var(--k)*12px);text-anchor:middle;dominant-baseline:central;pointer-events:none}
.rep .tn.on .tc{fill:#0d3b52;stroke:var(--cy);stroke-width:calc(var(--k)*3)}
.rep .tn.on .tx{fill:var(--cy)}
.rep .bsl{fill:#9aa7b8;font-family:var(--bd);font-weight:700;font-size:calc(var(--k)*11px);letter-spacing:calc(var(--k)*1.4px);text-anchor:middle}
.rep .bsl.on{fill:var(--cy)}
.rep .sfm{stroke:#fff;stroke-width:calc(var(--k)*3.5);stroke-dasharray:calc(var(--k)*4) calc(var(--k)*4)}
.rep .sft{fill:#fff;font-family:var(--bd);font-weight:700;font-size:calc(var(--k)*12px)}
.rrow{display:flex;gap:6px;overflow-x:auto;padding:8px 0 4px;scrollbar-width:none}.rrow::-webkit-scrollbar{display:none}
.rc{flex:none;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#dfe5ee;border-radius:999px;padding:7px 12px;font:700 12.5px var(--bd);border-left:4px solid #6b7686}
.rc.red{border-left-color:var(--red)}.rc.amber{border-left-color:var(--gold)}.rc.green{border-left-color:var(--green)}
.rc.on{background:rgba(95,208,255,.16);border-color:var(--cy);color:#fff}
.rls{display:flex;gap:3px;margin:8px 0 2px}
